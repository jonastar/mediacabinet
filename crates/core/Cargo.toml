[package]
name = "cabinet-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
