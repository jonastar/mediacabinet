<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lean-back · Series</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#07090D}
a{color:#B9AEFF}a:hover{color:#D6CFFF}
</style>
</helmet>
<div style="min-height: 100vh; background: #07090D; color: #F3F4F6; font-family: Sora, system-ui, sans-serif">

<section aria-labelledby="ls-title" style="min-height: 560px; background: #3A1C20; display: flex; flex-direction: column">
<header style="display: flex; gap: 16px; align-items: center; padding: 28px 56px">
<a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(7,9,13,0.45); color: #F3F4F6; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12.5 4L6.5 10l6 6"></path></svg></a>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em">shelf</span>
</header>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; padding: 0 56px 48px; max-width: 820px">
<h1 id="ls-title" style="margin: 0; font-size: 80px; font-weight: 800; line-height: 0.92; letter-spacing: -0.04em">Kitsune Road</h1>
<p style="margin: 0; font-size: 16px; color: #E4E0E1">2019 · Animation · 2 seasons · New episode Fri 30 Oct</p>
<p style="margin: 0; max-width: 620px; font-size: 16px; line-height: 1.6; color: #E4E0E1">[Series overview from the primary provider.]</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#" style="display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 30px; border-radius: 999px; background: #F3F4F6; color: #07090D; text-decoration: none; font-weight: 700; font-size: 17px"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5l9 5.5-9 5.5z" fill="currentColor"></path></svg>Resume E07</a>
<button type="button" style="min-height: 56px; padding: 0 26px; border-radius: 999px; border: 0; background: rgba(7,9,13,0.45); color: #F3F4F6; font: inherit; font-weight: 600; font-size: 17px">Watch from start</button>
</div>
</div>
</section>

<section aria-labelledby="ls-eps" style="padding: 36px 56px 80px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<h2 id="ls-eps" style="margin: 0; font-size: 26px; font-weight: 700">Episodes</h2>
<div role="group" aria-label="Watch order" style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #B9AEFF; color: #120D2E; font: inherit; font-weight: 700; font-size: 15px">Aired</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #2A2F3A; background: transparent; color: #F3F4F6; font: inherit; font-size: 15px">Absolute</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #2A2F3A; background: transparent; color: #F3F4F6; font: inherit; font-size: 15px">No filler</button>
</div>
</div>
<div role="group" aria-label="Season" style="display: flex; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #F3F4F6; color: #07090D; font: inherit; font-weight: 700; font-size: 15px">Season 1</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #12151C; color: #F3F4F6; font: inherit; font-size: 15px">Season 2</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px 20px">
<sc-for list="{{eps}}" as="e" hint-placeholder-count="8">
<a href="#" style="display: flex; flex-direction: column; gap: 12px; color: #F3F4F6; text-decoration: none">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 14px; background: {{e.tone}}; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box; outline: {{e.outline}}; outline-offset: 3px">
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: {{e.badgeBg}}; color: {{e.badgeColor}}; font-size: 12px; font-weight: 700">{{e.badge}}</span>
<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.04em; color: {{e.numColor}}">{{e.n}}</span>
</div>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 16px">{{e.title}}</span><span style="font-size: 13.5px; color: #A3A9B5">{{e.meta}}</span></span>
</a>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const B = {
      w: ['Watched', 'rgba(7,9,13,0.6)', '#F3F4F6'],
      a: ['Ready', '#F3F4F6', '#07090D'],
      n: ['Up next', '#B9AEFF', '#120D2E'],
      g: ['Not in library', 'rgba(7,9,13,0.6)', '#F3F4F6'],
      m: ['File offline', '#FFB4A2', '#3A0F05']
    };
    const e = (n, title, meta, s, tone, dim) => ({
      n: (n < 10 ? '0' : '') + n, title, meta,
      badge: B[s][0], badgeBg: B[s][1], badgeColor: B[s][2],
      tone: dim ? '#151820' : tone, numColor: dim ? '#5C6373' : 'rgba(243,244,246,0.9)',
      outline: s === 'n' ? '2px solid #B9AEFF' : 'none'
    });
    return {
      eps: [
        e(1, 'The Fox at the Crossing', '24 min', 'w', '#4A2329'),
        e(2, 'Ash and Lanterns', '24 min', 'w', '#3F2A22'),
        e(3, 'Market Day', 'Filler · not in your library', 'g', '', true),
        e(4, 'A Debt Remembered', '24 min', 'w', '#2E2A44'),
        e(5, 'The Mountain Road', 'Stored on a drive that is offline', 'm', '', true),
        e(6, 'Bathhouse Detour', 'Filler · 24 min', 'a', '#23383A'),
        e(7, 'Two Tails', '14 min left', 'n', '#4A2329'),
        e(8, 'Foxfire', '4K available · 24 min', 'a', '#3E2A1E')
      ]
    };
  }
}
</script>
</body>
</html>
