[package]
name = "cabinet-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
notify = "8.2.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
utoipa = "6.0.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
