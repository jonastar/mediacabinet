[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono"] }

[profile.release]
lto = "thin"
strip = true
