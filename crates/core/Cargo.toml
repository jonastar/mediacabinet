[package]
name = "cabinet-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.22.1"
ring = "0.17.14"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
notify = "8.2.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx.workspace = true
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
utoipa = "6.0.0"
walkdir = "2.5.0"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
