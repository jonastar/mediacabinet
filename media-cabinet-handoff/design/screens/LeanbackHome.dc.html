<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lean-back · Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#07090D}
a{color:#B9AEFF}a:hover{color:#D6CFFF}
</style>
</helmet>
<div style="min-height: 100vh; background: #07090D; color: #F3F4F6; font-family: Sora, system-ui, sans-serif">

<section aria-labelledby="lh-hero" style="position: relative; min-height: 640px; background: #3A1C20; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; padding: 28px 56px">
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em">shelf</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px">
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #F3F4F6; color: #07090D; text-decoration: none; font-weight: 600; font-size: 15px">Home</a>
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #F3F4F6; text-decoration: none; font-size: 15px">Shows</a>
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #F3F4F6; text-decoration: none; font-size: 15px">Movies</a>
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; color: #F3F4F6; text-decoration: none; font-size: 15px">Coming up</a>
</nav>
<span style="flex: 1"></span>
<button type="button" aria-label="Search" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(7,9,13,0.4); color: #F3F4F6; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="9" r="6"></circle><path d="M13.5 13.5L18 18"></path></svg></button>
<button type="button" aria-label="Switch profile, Jon" style="width: 44px; height: 44px; border-radius: 999px; border: 2px solid #F3F4F6; background: #5B4BCF; color: #FFFFFF; font: inherit; font-weight: 700">J</button>
</header>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 0 56px 56px; max-width: 760px">
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #E9C9CC">Continue · no-filler order</span>
<h1 id="lh-hero" style="margin: 0; font-size: 88px; font-weight: 800; line-height: 0.92; letter-spacing: -0.04em">Kitsune Road</h1>
<p style="margin: 0; font-size: 18px; color: #E4E0E1">E07 · Two Tails · 14 min left</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#" style="display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 30px; border-radius: 999px; background: #F3F4F6; color: #07090D; text-decoration: none; font-weight: 700; font-size: 17px"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5l9 5.5-9 5.5z" fill="currentColor"></path></svg>Resume</a>
<a href="#" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border-radius: 999px; background: rgba(7,9,13,0.45); color: #F3F4F6; text-decoration: none; font-weight: 600; font-size: 17px">Episodes</a>
</div>
</div>
</section>

<div style="padding: 40px 0 80px; display: flex; flex-direction: column; gap: 44px">

<section aria-labelledby="lh-cw" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="lh-cw" style="margin: 0; padding: 0 56px; font-size: 22px; font-weight: 700">Keep watching</h2>
<div style="display: flex; gap: 20px; overflow-x: auto; padding: 0 56px 8px">
<sc-for list="{{cw}}" as="c" hint-placeholder-count="4">
<a href="#" style="flex: 0 0 360px; display: flex; flex-direction: column; gap: 12px; color: #F3F4F6; text-decoration: none">
<div style="position: relative; aspect-ratio: 16 / 9; border-radius: 14px; background: {{c.tone}}; display: flex; align-items: flex-end; overflow: hidden">
<div style="height: 5px; width: 100%; background: rgba(7,9,13,0.6)"><div style="height: 5px; width: {{c.p}}; background: #B9AEFF"></div></div>
</div>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 17px">{{c.show}}</span><span style="font-size: 14px; color: #A3A9B5">{{c.ep}}</span></span>
</a>
</sc-for>
</div>
</section>

<section aria-labelledby="lh-up" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="lh-up" style="margin: 0; padding: 0 56px; font-size: 22px; font-weight: 700">Coming this week</h2>
<div style="display: flex; gap: 16px; overflow-x: auto; padding: 0 56px 8px">
<sc-for list="{{up}}" as="u" hint-placeholder-count="4">
<div style="flex: 0 0 280px; display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 16px; background: #12151C">
<div style="flex: 0 0 64px; height: 64px; border-radius: 12px; background: {{u.tone}}; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 12px; font-weight: 700; text-transform: uppercase">{{u.day}}</span><span style="font-size: 14px; font-weight: 600">{{u.time}}</span>
</div>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-weight: 700">{{u.show}}</span><span style="font-size: 13px; color: #A3A9B5">{{u.ep}}</span></span>
</div>
</sc-for>
</div>
</section>

<section aria-labelledby="lh-shows" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="lh-shows" style="margin: 0; padding: 0 56px; font-size: 22px; font-weight: 700">Your shows</h2>
<div style="display: flex; gap: 20px; overflow-x: auto; padding: 0 56px 8px">
<sc-for list="{{shows}}" as="s" hint-placeholder-count="8">
<a href="#" style="flex: 0 0 190px; display: flex; flex-direction: column; gap: 10px; color: #F3F4F6; text-decoration: none">
<div style="position: relative; aspect-ratio: 2 / 3; border-radius: 14px; background: {{s.tone}}; display: flex; align-items: flex-start; justify-content: flex-end; padding: 10px; box-sizing: border-box">
<sc-if value="{{s.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="padding: 4px 10px; border-radius: 999px; background: #F3F4F6; color: #07090D; font-size: 12px; font-weight: 700">{{s.badge}}</span></sc-if>
</div>
<span style="font-weight: 600; font-size: 15px">{{s.title}}</span>
</a>
</sc-for>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cw: [
        { show: 'Kitsune Road', ep: 'E07 · Two Tails', p: '62%', tone: '#3A1C20' },
        { show: 'Harbor Lights', ep: 'S03E02 · Low Tide', p: '28%', tone: '#1E3247' },
        { show: 'Paper Saints', ep: 'S01E04 · Vellum', p: '81%', tone: '#33284A' },
        { show: 'The Long Orbit', ep: 'S01E09 · Perihelion', p: '0%', tone: '#1E3F31' }
      ],
      up: [
        { day: 'Mon', time: '03:00', show: 'Harbor Lights', ep: 'S03E04 · The Breakwater', tone: '#1E3247' },
        { day: 'Wed', time: '22:00', show: 'Lowland', ep: 'S02E01 · Floodplain', tone: '#45391F' },
        { day: 'Fri', time: '17:30', show: 'Kitsune Road', ep: 'E11 · The Ninth Gate', tone: '#3A1C20' },
        { day: 'Sat', time: '02:15', show: 'The Quiet Year', ep: 'S01E05 · Snowmelt', tone: '#42263A' }
      ],
      shows: [
        { title: 'Kitsune Road', tone: '#3A1C20', badge: '1 new', hasBadge: true },
        { title: 'Harbor Lights', tone: '#1E3247', badge: '', hasBadge: false },
        { title: 'Lowland', tone: '#45391F', badge: 'S2 Wed', hasBadge: true },
        { title: 'The Long Orbit', tone: '#1E3F31', badge: '', hasBadge: false },
        { title: 'Paper Saints', tone: '#33284A', badge: '', hasBadge: false },
        { title: 'Signal & Noise', tone: '#1B3C42', badge: '', hasBadge: false },
        { title: 'The Quiet Year', tone: '#42263A', badge: '', hasBadge: false },
        { title: 'Ferrymen', tone: '#2B3324', badge: '', hasBadge: false }
      ]
    };
  }
}
</script>
</body>
</html>
